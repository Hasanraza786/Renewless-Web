<!doctype html>
<!-- Source for /og.png (1200x630 share image). Render with headless Chrome; not linked from the site. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr 420px; align-items: center; padding: 0 72px; gap: 40px; }
    .t { display: flex; flex-direction: column; gap: 24px; }
    .t .wordmark { font-size: 30px; }
    .t .wordmark img { width: 48px; height: 48px; border-radius: 12px; }
    h1 { font-size: 58px; line-height: 1.1; }
    h1 em { font-style: normal; color: var(--accent); }
    p { color: var(--secondary); font-size: 24px; }
    .phones { position: relative; height: 630px; }
    .phones .device { position: absolute; width: 270px; box-shadow: none; }
    .phones .a { left: 0; top: 120px; rotate: -8deg; opacity: .7; }
    .phones .b { right: 0; top: 70px; }
  </style>
</head>
<body>
  <div class="t">
    <span class="wordmark"><img src="/favicon.svg" alt="">Renewless</span>
    <h1>Connect Gmail. <em>See every subscription.</em></h1>
    <p>No bank login · No typing · Free</p>
  </div>
  <div class="phones">
    <div class="device a"><img src="/screens/connect-inbox.jpg" alt=""></div>
    <div class="device b"><img src="/screens/your-subscriptions.jpg" alt=""></div>
  </div>
</body>
</html>
